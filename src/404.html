<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening inventory</title>
  </head>
  <body>
    <script>
      const segments = window.location.pathname.split("/").filter(Boolean);
      const payload = segments.length === 1 ? segments[0] : "";

      if (payload && /^[A-Za-z0-9_-]+$/.test(payload)) {
        window.location.replace(`/?payload=${encodeURIComponent(payload)}`);
      } else {
        window.location.replace("/");
      }
    </script>
  </body>
</html>
